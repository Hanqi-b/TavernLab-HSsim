name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check bundled card data
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('fireplace/cards/CardDefs.xml')
          assert path.stat().st_size > 1_000_000, 'CardDefs.xml is still a Git LFS pointer'
          PY
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run Python tests
        env:
          PYTHONPATH: tests:.
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
