[metadata]
name = fireplace
version = 0.1.0a1
description = TavernLab-HSsim, a local Hearthstone simulator and AI experimentation platform built on Fireplace
author = Jerome Leclanche
author_email = jerome@leclan.ch
maintainer = Hanqi-b
url = https://github.com/Hanqi-b/TavernLab-HSsim
download_url = https://github.com/Hanqi-b/TavernLab-HSsim/archive/refs/tags/v0.1.0-alpha.tar.gz
project_urls =
    Issues = https://github.com/Hanqi-b/TavernLab-HSsim/issues
    Releases = https://github.com/Hanqi-b/TavernLab-HSsim/releases
    Current maintainer = https://github.com/Hanqi-b
    Upstream Fireplace = https://github.com/jleclanche/fireplace
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Topic :: Games/Entertainment :: Simulation

[options]
packages = find:
include_package_data = True
zip_safe = False
python_requires = >=3.10
install_requires =
    hearthstone
    hearthstone_data

[options.packages.find]
exclude =
    tests

[options.package_data]
card_assets =
    placeholder.png
    SOURCES.md
fireplace.cards =
    CardDefs.xml
fireplace.web_gui =
    *.html
    *.js
    *.css
    *.webp

[options.entry_points]
console_scripts =
    fireplace-web = fireplace.web_gui.__main__:main
