name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check bundled card data
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('fireplace/cards/CardDefs.xml')
          assert path.stat().st_size > 1_000_000, 'CardDefs.xml is still a Git LFS pointer'
          PY
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run Python tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q tests
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Smoke test installed wheel without setuptools
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv --without-pip fireplace-wheel
          python -m pip --python fireplace-wheel/bin/python install "$GITHUB_WORKSPACE"/dist/*.whl
          fireplace-wheel/bin/python -I -c 'from importlib.metadata import version; import fireplace; assert fireplace.__version__ == version("fireplace")'
          fireplace-wheel/bin/python -I -m fireplace.web_gui --help
          fireplace-wheel/bin/tavernlab-web --help
          fireplace-wheel/bin/fireplace-web --help
